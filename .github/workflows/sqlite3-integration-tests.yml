name: SQLite3 Integration Tests
on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  contents: read

jobs:
   build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smalltalk:
          - Pharo64-9.0
          - Pharo64-10
          - Pharo64-11
          - Pharo64-12
          - Pharo64-13
    name: ${{ matrix.smalltalk }}
    steps:
      - uses: actions/checkout@v5
      - name: Install SQLite3
        run: ./scripts/install-SQLite3.sh
      - name: Set up Smalltalk CI
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Load Image and Run Integration Tests
        run: smalltalkci -s ${{ matrix.smalltalk }} .smalltalkci/.SQLite3.ston
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 15
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: SQLite3-Integration-Tests-${{matrix.smalltalk}}
          token: ${{ secrets.CODECOV_TOKEN }}
