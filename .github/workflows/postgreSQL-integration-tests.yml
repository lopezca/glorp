name: PostgreSQL Integration Tests
on:
  - push
  - pull_request
  - workflow_dispatch
jobs:
   build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smalltalk:
          - Pharo64-12
          - Pharo64-13
          - Pharo64-14
        rdbms:
          - PostgreSQLv15
          - PostgreSQLv16
          - PostgreSQLv17
          - PostgreSQLv18
    name: ${{ matrix.smalltalk }} + ${{ matrix.rdbms }}
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL
        run: ./scripts/setup-PostgreSQL.sh
        env:
          RDBMS: ${{ matrix.rdbms }}
      - name: Set up Smalltalk CI
        uses: hpi-swa/setup-smalltalkCI@v1
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Load Image and Run Integration Tests
        run: smalltalkci -s ${{ matrix.smalltalk }} .smalltalkci/.PostgreSQL.ston
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RDBMS: ${{ matrix.rdbms }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          name: PostgreSQL-Integration-Tests-${{matrix.smalltalk}}
          token: ${{ secrets.CODECOV_TOKEN }}
