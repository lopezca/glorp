name: Shellcheck
on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Shellcheck
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
